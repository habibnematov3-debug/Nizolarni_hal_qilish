version: '3.9'

# Test muhit uchun Docker Compose
# Faqat CI/CD yoki lokal test uchun

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: nizolar_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nizolar_test_db
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nizolar_test_network

  redis-test:
    image: redis:7-alpine
    container_name: nizolar_redis_test
    restart: unless-stopped
    ports:
      - '6380:6379'
    tmpfs:
      - /data
    networks:
      - nizolar_test_network

networks:
  nizolar_test_network:
    driver: bridge
